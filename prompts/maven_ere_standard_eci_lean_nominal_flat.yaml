system: |
  # Context
  MAVEN-ERE is a large-scale English event relation extraction dataset built on Wikipedia articles
  covering diverse real-world topics. Event mentions are marked inline as <ID text>
  (e.g. <e3 collapsed>, <e12 earthquake>). Use the alphanumeric ID from each tag as the
  mention identifier in your output.
  Causal annotation covers CAUSE (direct causation) and PRECONDITION (enabling condition);
  both map to "causes"/"causedby" in the label set below.

  PREDICT BOTH INTRA- AND INTER-SENTENCE RELATIONS: consider pairs of event mentions that
  occur within the SAME sentence AND pairs whose mentions occur in DIFFERENT sentences —
  both are in scope.

  ## Label Set (Use these exact strings)
  - **"causes"**: Ti causes/enables/leads to or prevents the absence of Tj (Ti → Tj).
  - **"causedby"**: Tj causes/enables/leads to or prevents the absence of Ti (Tj → Ti).
  - **"norel"**: No justified causal link (reject temporal-only, correlation-only, or vague plausibility).


  If there are no mentions in the text and no pairs to classify, return an empty array [].

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

  ## Which mention to name
  When several tags in the SAME sentence denote the one happening — a noun and the verb that
  realises it (`<e0 Cyclone> Joy <e1 struck>`, `the <e26 counter-attacks> ... <e27 regained>`,
  `an explosives <e0 test> <e1 carried out>`) — name the NOMINAL one as the cause endpoint,
  even when the causal wording attaches to the verb. Effects go the other way: name the verb
  or the predicate that reports the outcome. Do not emit both variants of the same happening
  as separate pairs, and never link two tags that denote the same happening to each other.

  ## Shape of the answer
  Point each cause directly at every consequence you can justify from it, including
  consequences reported several sentences later. Do NOT build a chain: if A brings about B
  and B brings about C, and the text presents C as a consequence of A, emit A->C as well
  rather than relying on A->B->C. Effects are usually endpoints — a mention you have already
  named as an effect is rarely the cause of something else.

  In a true causal pair, both mentions should be the actual events — one the cause, one the effect — not a word that merely states the relation between them. A mention like "initiated," "triggered," or "caused" is often naming the relation itself rather than being one of its arguments, so don't mark it as the cause or effect of another pair when that's its role in the sentence.

user_template: |

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

  Rules:
  - Labels: "causes" | "causedby" | "norel".
  - Consider explicit AND implicit causality; include enablement and prevention as causal.
  - Mention IDs come from the <ID text> tags in the text (e.g. <e3 collapsed> → ID is "e3").
  - Consider pairs of mentions that occur within the SAME sentence AND pairs whose two
    mentions are in DIFFERENT sentences — both are in scope.
  - Return ONLY a JSON array of causal pairs (omit a pair to mark it norel):
  [
    {{"pair":"e3,e12","label":"causes"}},
    {{"pair":"e12,e3","label":"causedby"}}
  ]

  Coherence Rules:
  - Symmetry: "A,B" "causes" implies "B,A" "causedby" and inversely — both must appear.
  - Omission: Any pair you leave out is treated as norel.
  - Contradiction: "A,B" "norel" is incompatible with "A,B" "causes" or "A,B" "causedby".

  Text:
  {doc_text}

  Predict all causal pairs among event mentions in the text, whether the two mentions are
  in the same sentence or in different sentences.

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

