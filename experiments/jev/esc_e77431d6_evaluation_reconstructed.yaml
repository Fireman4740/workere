# Reconstructed evaluation settings, NOT the original e77431d6 run snapshot.
# Source: config.yaml merged with queues/baseline_coref.yaml experiment r7_esc.
# Seven-pass voting describes the historical baseline; Mercury emits final pair decisions once.
seed: 42
active_dataset: event_story_line
datasets:
  event_story_line:
    name: EventStoryLine-0.9
    repo_id: Nofing/EventStoryLine-0.9-standard-eci-workere
    split: train
    text_field: text
    ann_field: annots
    max_examples: 233
    kfold:
      enabled: true
      n_folds: 5
    constrain_to_pair_list: false
data:
  shuffle_docs: true
  shuffle_pair_list: true
  reshuffle_per_resample: true
  binary_undirected: false
  vote_to_binary: false
  binary_default: norel
  novote_norel: true
  labels:
  - causes
  - causedby
  - norel
experiment:
  resampling:
    enabled: true
    n_runs: 7
    tie_breaking: norel
    distinct_fewshots: true
