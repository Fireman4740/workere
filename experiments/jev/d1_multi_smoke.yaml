schema: workere-experiment/v1
name: esc-d1ultra-multi-smoke
dataset:
  name: esc
  source_config: esc_e77431d6_evaluation_reconstructed.yaml
  repo_id: Nofing/EventStoryLine-0.9-standard-eci-workere
  revision: e6418e8747ac1c7fecf66d56ae41fbde7fd5967a
  seed: 42
  split: dev
  document_ids:
  - 41_9ecbplus.xml
protocol: relation_gold_mentions
seed: 42
plugins:
- pipelines.jev.pipeline
models:
- id: liquid/d1-ultra
  version: d1-ultra-20261015
pipeline:
  entity_extractor:
    plugin: reference
    version: '1'
  candidate_generator:
    plugin: historical
    version: '1'
  relation_predictor:
    plugin: jev_decision
    version: '1'
    params:
      threshold: 0.5
      max_workers: 64
      extra_questions:
        same_event:
          instructions: Do both selected mentions denote the same real-world event?
          criteria:
            'true': Same event instance.
            'false': Distinct event instances.
        before:
          instructions: Does event A occur before event B?
          criteria:
            'true': A precedes B.
            'false': A does not precede B or timing is unknown.
        narrative:
          instructions: Is either event an explanatory or enabling narrative link
            to the other?
          criteria:
            'true': Supported explanatory or enabling link.
            'false': No such link.
        connector:
          instructions: Does an explicit causal connective link the two exact mentions?
          criteria:
            'true': Explicit causal connective links these mentions.
            'false': No such connective.
      client:
        provider: openrouter
        endpoint: https://openrouter.ai/api/alpha/decisions
        model: liquid/d1-ultra
        model_version: d1-ultra-20261015
        api_key_env: OPENROUTER_API_KEY
        mode: live
        timeout: 120
        retries: 8
        requests_per_minute: 6000
        max_calls: 60000
        max_context_tokens: 32768
        budget_usd: 1
        max_cost_per_call_usd: 0.0015
        input_price_per_million: 0.042
        cache_path: ~/.local/share/openresearch/workere-decisions/cache.sqlite
        expected_served_version: liquid/d1-ultra-20261015
        retry_backoff_seconds: 2
        retry_max_wait_seconds: 3600
        shared_budget:
          path: ~/.local/share/openresearch/workere-decisions/plan-budget.sqlite
          scope: esc-improvement-20261016-10usd
          limit_usd: 10
          initial_spend_usd: 5.224675
evaluation:
  primary_metric: binary
  bootstrap_samples: 1000
  confidence_level: 0.95
  bootstrap_seed: 42
  require_historical_parity: false
  historical_reports: []
execution:
  allow_network: true
  allow_paid: true
  error_policy: raise
output_dir: ../../logs/jev-runs
