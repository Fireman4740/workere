schema: workere-experiment/v1
name: causal_timebank-span-noul-MOCK-preparation
dataset:
  name: causal_timebank
  split: train
  source_config: ../../config.yaml
  repo_id: Nofing/CausalTimeBank-standard-eci
  revision: de8605324329a16c64c328ac838c7891ff2e423d
  max_examples: 3
  seed: 42
protocol: relation_gold_mentions
seed: 42
plugins:
- pipelines.jev.pipeline
models:
- id: respan/span-01-lite
  version: span-01-lite-20260925
pipeline:
  entity_extractor:
    plugin: reference
    version: '1'
  candidate_generator:
    plugin: historical
    version: '1'
  relation_predictor:
    plugin: jev_decision
    version: '1'
    params:
      threshold: 0.5
      client:
        provider: openrouter
        endpoint: https://openrouter.ai/api/alpha/decisions
        model: respan/span-01-lite
        model_version: span-01-lite-20260925
        api_key_env: OPENROUTER_API_KEY
        mode: mock
        timeout: 60
        retries: 1
        requests_per_minute: 20
        max_calls: 100000
        max_context_tokens: 32768
        budget_usd: 0
        max_cost_per_call_usd: 0.002
        input_price_per_million: 0
        cache_path: ~/.local/share/openresearch/workere-decisions/cache.sqlite
evaluation:
  primary_metric: binary
  bootstrap_samples: 1000
  confidence_level: 0.95
  bootstrap_seed: 42
  require_historical_parity: false
  historical_reports: []
execution:
  allow_network: false
  allow_paid: false
  error_policy: raise
output_dir: ../../logs/jev-runs
