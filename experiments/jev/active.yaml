# Free Mercury full ESC evaluation; preserve inputs and successful cached decisions.
schema: workere-experiment/v1
name: esc-mercury-noul-e77431d6-train233
dataset:
  name: esc
  split: train
  source_config: esc_e77431d6_evaluation_reconstructed.yaml
  repo_id: Nofing/EventStoryLine-0.9-standard-eci-workere
  revision: e6418e8747ac1c7fecf66d56ae41fbde7fd5967a
  seed: 42
  max_examples: 233
protocol: relation_gold_mentions
seed: 42
plugins:
- pipelines.jev.pipeline
models:
- id: inception/mercury-decide:free
  version: mercury-decide-20260930
pipeline:
  entity_extractor:
    plugin: reference
    version: '1'
  candidate_generator:
    plugin: historical
    version: '1'
  relation_predictor:
    plugin: jev_decision
    version: '1'
    params:
      threshold: 0.5
      client:
        provider: openrouter
        endpoint: https://openrouter.ai/api/alpha/decisions
        model: inception/mercury-decide:free
        model_version: mercury-decide-20260930
        api_key_env: OPENROUTER_API_KEY
        mode: live
        timeout: 60
        retries: 6
        requests_per_minute: 20
        max_calls: 244260
        max_context_tokens: 32768
        budget_usd: 0
        max_cost_per_call_usd: 0.002
        input_price_per_million: 0
        cache_path: ~/.local/share/openresearch/workere-decisions/cache.sqlite
        expected_served_version: inception/mercury-decide-20260930
        retry_backoff_seconds: 60
        retry_max_wait_seconds: 90000
evaluation:
  primary_metric: binary
  bootstrap_samples: 1000
  confidence_level: 0.95
  bootstrap_seed: 42
  require_historical_parity: false
  historical_reports: []
execution:
  allow_network: true
  allow_paid: false
  error_policy: raise
output_dir: ../../logs/jev-runs
