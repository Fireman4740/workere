# H2-F: Harness² on the frozen R3 Luna x d1 fusion (k=2, parallel recursion), role-routed proposers.
# Same 8 DEV44 docs as H2-D/H2-L (topics 5, 12, 18, 33). Base harness = frozen fusion mean_sym >= 0.39.
schema: workere-harness2/v1
name: esc-h2-fusion
code_version: 1
executor: fusion
executor_template: harness2/fusion-executor.yaml
suites_dir: round4/suites
documents:
- 5_5ecbplus.xml
- 5_7ecbplus.xml
- 12_10ecbplus.xml
- 12_9ecbplus.xml
- 18_7ecbplus.xml
- 18_8ecbplus.xml
- 33_11ecbplus.xml
- 33_8ecbplus.xml
k: 2
modes:
- agg
seed: 42
domain_parallel: 2
work_root: ~/.local/share/openresearch/workere-harness2
proposer:
