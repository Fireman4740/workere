  routes:
    propose: [openrouter/minimax/minimax-m3.1-flash:free, openrouter/inclusionai/ling-3.0-flash]
    compose: [openrouter/deepseek/deepseek-v4.1-flash-1017, openrouter/deepseek/deepseek-v4-flash-0731]
    select: [openrouter/deepseek/deepseek-v4.1-flash-1017, openrouter/deepseek/deepseek-v4-flash-0731]
    reflect: [openrouter/deepseek/deepseek-v4-flash-0731, openrouter/inclusionai/ling-3.0-flash]
  models:  # OpenRouter list prices 2026-10-20, USD per million tokens [input, output]
    openrouter/minimax/minimax-m3.1-flash:free: {price: [0, 0], reserve: 0}
    openrouter/inclusionai/ling-3.0-flash: {price: [0.021, 0.063], reserve: 0.05}
    openrouter/deepseek/deepseek-v4-flash-0731: {price: [0.1298, 0.3894], reserve: 0.3}
    openrouter/deepseek/deepseek-v4.1-flash-1017: {price: [0.15, 0.6], reserve: 0.4}
budget:
  path: ~/.local/share/openresearch/workere-decisions/plan-budget.sqlite
  scope: esc-h2-fusion-20261020-4p8usd
  limit_usd: 4.8
  initial_spend_usd: 0
