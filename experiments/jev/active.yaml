# Fixed launch entry. KA: fusion band [0.2, 0.7) only; one yes/no call per relation type, then one
# elimination call at a time until two types remain, then a contrastive final call. Outside the band
# the frozen fusion decision is kept. Chat route (multi-stage, short calls), 24 parallel calls.
