# Executor template for one Harness² rollout of the frozen R3 Luna x d1 fusion; suite, harness_dir and output_dir are set per rollout.
schema: workere-experiment/v1
name: h2-fusion-template
dataset:
  name: esc
  split: train
  suite: ../round4/suites/REPLACED_PER_DOCUMENT.json
protocol: relation_gold_mentions
seed: 42
plugins:
- pipelines.harness2_eci.predictors
models:
- id: openai/gpt-6-luna:batch
  version: gpt-6-luna-20260922
- id: liquid/d1-ultra
  version: d1-ultra-20261015
pipeline:
  entity_extractor:
    plugin: reference
    version: '1'
  candidate_generator:
    plugin: historical
    version: '1'
  relation_predictor:
    plugin: fusion_harness
    version: '1'
    params:
      luna:
        client:
          provider: openrouter
          endpoint: https://openrouter.ai/api/v1/batches
          model: openai/gpt-6-luna:batch
          model_version: gpt-6-luna-20260922
          api_key_env: OPENROUTER_API_KEY
          mode: live
          timeout: 600
          retries: 4
          requests_per_minute: 6000
          max_calls: 64
          max_context_tokens: 1050000
          budget_usd: 0.25
          max_cost_per_call_usd: 0.01
          input_price_per_million: 0.05
          cache_path: ~/.local/share/openresearch/workere-decisions/h2-luna.sqlite
          retry_backoff_seconds: 2
          retry_max_wait_seconds: 3600
          reasoning_effort: high
          max_output_tokens: 32768
          shared_budget:
            path: ~/.local/share/openresearch/workere-decisions/plan-budget.sqlite
            scope: esc-h2-fusion-20261020-4p8usd
            limit_usd: 4.8
            initial_spend_usd: 0
        path: ../../../prompts/esl_standard_eci_lean_coref.yaml
        selection_path: experiments/jev/document-selection.json
        repo_id: Nofing/EventStoryLine-0.9-standard-eci-workere
        revision: e6418e8747ac1c7fecf66d56ae41fbde7fd5967a
        passes: 7
      decision:
        threshold: 0.5
        max_workers: 256
        client:
          provider: openrouter
          endpoint: https://openrouter.ai/api/alpha/decisions
          model: liquid/d1-ultra
          model_version: d1-ultra-20261015
          api_key_env: OPENROUTER_API_KEY
          mode: live
          timeout: 120
          retries: 8
          requests_per_minute: 6000
          max_calls: 4000
          max_context_tokens: 32768
          budget_usd: 1.5
          max_cost_per_call_usd: 0.0015
          input_price_per_million: 0.042
          cache_path: ~/.local/share/openresearch/workere-decisions/cache.sqlite
          expected_served_version: liquid/d1-ultra-20261015
          retry_backoff_seconds: 2
          retry_max_wait_seconds: 3600
          shared_budget:
            path: ~/.local/share/openresearch/workere-decisions/plan-budget.sqlite
            scope: esc-h2-fusion-20261020-4p8usd
            limit_usd: 4.8
            initial_spend_usd: 0
      threshold: 0.39
      harness_dir: REPLACED_PER_ROLLOUT
evaluation:
  primary_metric: binary
  bootstrap_samples: 1000
  confidence_level: 0.95
  bootstrap_seed: 42
  require_historical_parity: false
  historical_reports: []
execution:
  allow_network: true
  allow_paid: true
  error_policy: raise
output_dir: REPLACED_PER_ROLLOUT
