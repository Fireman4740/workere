# Executor template for one Harness² rollout (decision); suite, harness_dir and output_dir are set per rollout.
schema: workere-experiment/v1
name: h2-decision-template
dataset:
  name: esc
  split: train
  suite: ../round4/suites/REPLACED_PER_DOCUMENT.json
protocol: relation_gold_mentions
seed: 42
plugins:
- pipelines.harness2_eci.predictors
models:
- id: liquid/d1-ultra
  version: d1-ultra-20261015
pipeline:
  entity_extractor:
    plugin: reference
    version: '1'
  candidate_generator:
    plugin: historical
    version: '1'
  relation_predictor:
    plugin: decision_harness
    version: '1'
    params:
      threshold: 0.5
      max_workers: 256
      client:
        provider: openrouter
        endpoint: https://openrouter.ai/api/alpha/decisions
        model: liquid/d1-ultra
        model_version: d1-ultra-20261015
        api_key_env: OPENROUTER_API_KEY
        mode: live
        timeout: 120
        retries: 8
        requests_per_minute: 6000
        max_calls: 4000
        max_context_tokens: 32768
        budget_usd: 0.25
        max_cost_per_call_usd: 0.0015
        input_price_per_million: 0.042
        cache_path: ~/.local/share/openresearch/workere-decisions/cache.sqlite
        expected_served_version: liquid/d1-ultra-20261015
        retry_backoff_seconds: 2
        retry_max_wait_seconds: 3600
        shared_budget:
          path: ~/.local/share/openresearch/workere-decisions/plan-budget.sqlite
          scope: esc-h2-pilot-20261019-6usd
          limit_usd: 6
          initial_spend_usd: 0
      harness_dir: REPLACED_PER_ROLLOUT
evaluation:
  primary_metric: binary
  bootstrap_samples: 1000
  confidence_level: 0.95
  bootstrap_seed: 42
  require_historical_parity: false
  historical_reports: []
execution:
  allow_network: true
  allow_paid: true
  error_policy: raise
output_dir: REPLACED_PER_ROLLOUT
